name: CI · V2 API

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'packages/config/**'
      - 'pyproject.toml'
      - 'tools/**'
      - '.github/workflows/ci-api.yml'
  push:
    branches: [main, develop]
    paths:
      - 'apps/api/**'
      - 'packages/config/**'
      - 'pyproject.toml'
      - 'tools/**'
      - '.github/workflows/ci-api.yml'

permissions:
  contents: read

env:
  APP_ENV: local
  # Most jobs contact no database; a placeholder URL satisfies fail-fast config.
  # `migrations-postgres` overrides it with the service container below.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  SECRET_KEY: ci-only-secret-key
  CORS_ORIGINS: http://localhost:5173

jobs:
  migrations-postgres:
    name: Migrations against Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # F2: the SQLite round-trip in the main job cannot catch a Postgres-only DDL
    # error (JSONB defaults, constraint names, index expressions). This runs the
    # real migrations against the engine production uses.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nelavista
          POSTGRES_PASSWORD: nelavista
          POSTGRES_DB: nelavista_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nelavista -d nelavista_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: uv sync --all-packages
      - name: Migrations execute on Postgres
        working-directory: apps/api
        env:
          POSTGRES_TEST_URL: postgresql://nelavista:nelavista@localhost:5432/nelavista_test
        run: uv run --extra dev python -m pytest -q tests/test_migrations.py

  api:
    name: Lint · test · single head
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Installs every workspace member into .venv. NOTE: `uv sync` creates its own
      # environment — every later step MUST go through `uv run`, or it will use the
      # system interpreter and fail with ModuleNotFoundError.
      - name: Install
        run: uv sync --all-packages
      - name: Lint (ruff)
        working-directory: apps/api
        run: uv run --extra dev ruff check .
      - name: Tests
        working-directory: apps/api
        run: uv run --extra dev python -m pytest -q
      - name: Single Alembic head (must be exactly one)
        working-directory: apps/api
        run: |
          uv run alembic -c alembic.ini heads | tee /tmp/heads
          count=$(grep -c . /tmp/heads || true)
          echo "alembic heads: $count"
          test "$count" -eq 1
