name: CI · Web + Admin

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/admin/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - 'tools/check_web_budget.mjs'
      - '.github/workflows/ci-js.yml'
  push:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'apps/admin/**'
      - 'packages/**'

permissions:
  contents: read

jobs:
  web-admin:
    name: Lint · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # pnpm version comes from package.json "packageManager" (pnpm@9.12.3).
        # Do NOT set `version` here — specifying both causes ERR_PNPM_BAD_PM_VERSION.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @nelavista/web --filter @nelavista/admin lint
      - name: Typecheck
        run: pnpm --filter @nelavista/web --filter @nelavista/admin typecheck
      - name: Test
        run: pnpm --filter @nelavista/web test
      - name: Build
        run: pnpm --filter @nelavista/web --filter @nelavista/admin build
      - name: Web first-load budget
        # B12: the budget is measured and enforced, and lazy route chunks are not
        # counted against the first load.
        run: pnpm check:web-budget
