name: CI · Mobile

# Full native builds happen on EAS (cloud), not here — the team has no Mac.
# This job only guards the JS/TS: lint + typecheck. See docs/runbooks/mobile-release.md.
on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/ci-mobile.yml'
  push:
    branches: [main, develop]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'

permissions:
  contents: read

jobs:
  mobile:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @nelavista/mobile typecheck
