<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',system-ui,sans-serif; }
  body { background:#0d1117; color:#e6edf3; }
  a { color:#58a6ff; }
  .container { max-width:1100px; margin:0 auto; padding:24px 16px 80px; }
  h1 { font-size:1.45rem; margin:10px 0 6px; }
  h2 { font-size:1.02rem; margin:0 0 12px; }
  .subtitle { color:#8b949e; font-size:0.88rem; margin-bottom:18px; line-height:1.5; max-width:780px; }
  .btn { display:inline-flex; align-items:center; gap:6px; background:#238636; border:none; color:#fff; padding:9px 15px; border-radius:8px; font-size:0.84rem; font-weight:600; cursor:pointer; text-decoration:none; }
  .btn:hover { background:#2ea043; }
  .btn.secondary { background:#21262d; border:1px solid #30363d; color:#e6edf3; }
  .btn.secondary:hover { border-color:#58a6ff; }
  .btn.danger { background:#da3633; } .btn.danger:hover { background:#f85149; }
  .btn.blue { background:#1f6feb; } .btn.blue:hover { background:#388bfd; }
  .btn.small { padding:6px 11px; font-size:0.78rem; }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .flash { background:rgba(56,139,253,0.12); border:1px solid rgba(56,139,253,0.4); padding:10px 14px; border-radius:8px; margin-bottom:12px; font-size:0.88rem; }
  .panel { background:#161b22; border:1px solid #21262d; border-radius:12px; padding:16px; margin-bottom:14px; }
  .badge { display:inline-flex; align-items:center; gap:4px; font-size:0.7rem; font-weight:700; padding:2px 8px; border-radius:10px; background:rgba(139,148,158,0.15); color:#8b949e; white-space:nowrap; }
  .badge.green { background:rgba(63,185,80,0.15); color:#3fb950; }
  .badge.orange { background:rgba(210,153,34,0.15); color:#d29922; }
  .badge.red { background:rgba(248,81,73,0.15); color:#f85149; }
  .badge.blue { background:rgba(56,139,253,0.15); color:#58a6ff; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 14px; }
  .tabs a { text-decoration:none; color:#8b949e; border:1px solid #30363d; padding:6px 11px; border-radius:20px; font-size:0.8rem; font-weight:600; }
  .tabs a.active { color:#fff; background:#1f6feb; border-color:#1f6feb; }
  .stat-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:10px; margin-bottom:14px; }
  .stat { background:#161b22; border:1px solid #21262d; border-radius:10px; padding:12px; }
  .stat b { display:block; font-size:1.3rem; }
  .stat span { color:#8b949e; font-size:0.75rem; }
  table { width:100%; border-collapse:collapse; font-size:0.84rem; }
  th, td { text-align:left; padding:9px 8px; border-bottom:1px solid #21262d; vertical-align:top; }
  th { color:#8b949e; font-weight:600; font-size:0.74rem; text-transform:uppercase; letter-spacing:0.04em; }
  .muted { color:#8b949e; font-size:0.8rem; }
  .table-wrap { overflow-x:auto; }
  .field { margin-bottom:12px; }
  .field label, .field .lbl { display:block; font-size:0.78rem; color:#8b949e; margin-bottom:5px; font-weight:600; }
  .field input[type=text], .field input[type=url], .field input[type=date], .field input[type=search], .field select, .field textarea { width:100%; background:#0d1117; border:1px solid #30363d; color:#e6edf3; padding:9px 11px; border-radius:8px; font-size:0.88rem; outline:none; }
  .field textarea { resize:vertical; min-height:80px; line-height:1.5; }
  .field .hint { color:#6e7681; font-size:0.74rem; margin-top:4px; line-height:1.4; }
  .grid2 { display:grid; grid-template-columns:1fr; gap:0 14px; }
  @media (min-width:760px) { .grid2 { grid-template-columns:1fr 1fr; } }
  .checks { display:flex; flex-wrap:wrap; gap:6px; }
  .checks label { display:inline-flex; align-items:center; gap:5px; background:#0d1117; border:1px solid #30363d; padding:5px 9px; border-radius:16px; font-size:0.78rem; color:#e6edf3; cursor:pointer; font-weight:500; margin:0; }
  .toggle { display:flex; align-items:center; gap:8px; font-size:0.86rem; margin:6px 0; }
  .errors { background:rgba(248,81,73,0.1); border:1px solid rgba(248,81,73,0.4); color:#ffa198; padding:10px 14px; border-radius:8px; margin-bottom:14px; font-size:0.86rem; }
  .errors li { margin-left:16px; }
  .layout { display:grid; grid-template-columns:1fr; gap:14px; }
  @media (min-width:980px) { .layout { grid-template-columns:minmax(0,1fr) 320px; align-items:start; } .side { position:sticky; top:62px; } }
  .actions form { display:inline; }
  .actions { display:flex; flex-wrap:wrap; gap:6px; }
  .problems { color:#d29922; font-size:0.8rem; margin:8px 0 0 16px; }
</style>
