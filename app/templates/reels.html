    <title>Nelavista · TikTok style reels</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #000;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        #top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        #back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #top-bar-title {
            font-weight: 600;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .right-buttons {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        #admin-btn.admin-active {
            background: #4caf50;
            border-color: #4caf50;
            color: black;
        }

        #search-bar-container {
            position: fixed;
            top: 72px;
            left: 16px;
            right: 16px;
            z-index: 998;
            transition: opacity 0.2s;
        }

        .search-bar {
            width: 100%;
            height: 52px;
            background: #1a1a1a;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            padding: 0 16px;
            color: #aaa;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(5px);
        }

        .search-bar:hover {
            background: #252525;
            border-color: rgba(255,255,255,0.2);
        }

        .search-bar .search-icon {
            font-size: 1.2rem;
            margin-right: 12px;
            opacity: 0.7;
        }

        .search-bar .placeholder {
            font-size: 1rem;
            font-weight: 400;
            opacity: 0.7;
        }

        /* YouTube course selector UI (inside reel container) */
        .youtube-course-panel {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #000;
            text-align: center;
        }

        .course-selector-box {
            width: 100%;
            max-width: 400px;
            background: #1a1a1a;
            border-radius: 48px;
            border: 1px solid #333;
            padding: 20px;
            margin-bottom: 20px;
        }

        .course-selector-box select {
            width: 100%;
            padding: 14px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 30px;
            color: white;
            font-size: 1rem;
            margin-bottom: 16px;
            outline: none;
            cursor: pointer;
        }

        .course-selector-box button {
            width: 100%;
            background: white;
            border: none;
            border-radius: 40px;
            padding: 14px;
            font-weight: 600;
            cursor: pointer;
            color: black;
            transition: 0.2s;
        }

        .course-selector-box button:active {
            transform: scale(0.96);
        }

        .search-prompt-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.7;
        }

        .search-prompt-text {
            color: #aaa;
            font-size: 1rem;
            margin-top: 12px;
        }

        #reel-container {
            position: fixed;
            top: 140px;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            padding: 0;
            background: black;
        }

        .reel-item {
            height: 100vh;
            width: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reel-media {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            aspect-ratio: 9 / 16;
            max-height: 100vh;
            width: auto;
            position: relative;
        }

        .reel-media video,
        .reel-media iframe {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            border: none;
            image-rendering: auto;
        }

        .reel-media iframe {
            pointer-events: none;
        }

        /* Loading overlay for videos */
        .video-loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            transition: opacity 0.2s ease;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Always-present click-catcher over the iframe (which has pointer-events:none),
           so tapping the video can pause/resume it. Only visually "shown" (dimmed +
           play icon) while paused; fully transparent but still clickable while playing. */
        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .play-overlay:not(.hidden) {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
        }
        .play-icon {
            font-size: 4rem;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s;
        }
        .play-overlay:not(.hidden) .play-icon {
            opacity: 1;
        }
        .play-overlay:active .play-icon {
            transform: scale(0.9);
        }

        .video-overlay-right {
            position: absolute;
            right: 12px;
            bottom: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            z-index: 20;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* New transport buttons container (horizontal, positioned left side) */
        .transport-controls {
            position: absolute;
            left: 12px;
            bottom: 120px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 20;
        }
        .transport-btn {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 30px;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .transport-btn:active {
            transform: scale(0.95);
            background: rgba(0,0,0,0.8);
        }

        .overlay-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            filter: drop-shadow(0 2px 4px black);
            transition: 0.2s;
        }

        .overlay-btn span {
            font-size: 0.9rem;
            margin-top: 4px;
            background: rgba(0,0,0,0.4);
            padding: 2px 8px;
            border-radius: 30px;
        }

        .overlay-btn.liked {
            color: #ff4d6d;
        }

        .delete-overlay {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 25;
        }

        .delete-btn {
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .video-info-bottom {
            position: absolute;
            bottom: 30px;
            left: 16px;
            right: 70px;
            z-index: 15;
            color: white;
            text-shadow: 0 1px 3px black;
        }

        .creator-name {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .caption {
            font-size: 0.95rem;
            opacity: 0.9;
            margin-bottom: 6px;
        }

        .badge {
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            display: inline-block;
            margin-right: 6px;
        }

        .empty-reel {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #aaa;
            font-size: 1.2rem;
            padding: 20px;
        }

    </style>

            let localLikes = new Map();

            // ---------- AUDIO CONTROL STATE ----------
            let userInteracted = false;
            let activeReelElement = null;
            let viewCountedSet = new Set();
            let isManuallyUnmuted = true;

            // YouTube Player instances
            let ytPlayers = new Map(); // key: iframe id, value: YT.Player
            let ytReady = false;
            let ytQueue = [];

            function onYouTubeIframeAPIReady() {
                ytReady = true;
                ytQueue.forEach(id => initYouTubePlayer(id));
                ytQueue = [];
            }
            window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

            function initYouTubePlayer(iframeId) {
                const iframe = document.getElementById(iframeId);
                if (!iframe) return;
                // Create YT.Player for this iframe
                const player = new YT.Player(iframeId, {
                    events: {
                        onReady: (event) => {
                            if (isManuallyUnmuted) event.target.unMute();
                            else event.target.mute();
                            // Auto-start the reel that's active (or the first one, if none is active yet)
                            const reel = iframe.closest('.reel-item');
                            const firstReel = reelContainer.querySelector('.reel-item');
                            if (reel && (reel === activeReelElement || (!activeReelElement && reel === firstReel))) {
                                event.target.playVideo();
                                const overlay = reel.querySelector('.play-overlay');
                                if (overlay) overlay.classList.add('hidden');
                                if (!activeReelElement) setActiveReel(reel);
                            }
                        }
                    }
                });
                ytPlayers.set(iframeId, player);
            }

            // Helper to get YouTube embed URL, with our own UI standing in for YouTube's controls
            function getYouTubeEmbedNoAuto(url) {
                const match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/);
                return match ? `https://www.youtube.com/embed/${match[1]}?enablejsapi=1&playsinline=1&controls=0&modestbranding=1&rel=0&iv_load_policy=3&fs=0` : url;
            }

            // ---------- DOM elements ----------
            const reelContainer = document.getElementById('reel-container');

            // Helper: get course videos
            function getCourseVideos(courseName) {
                return courseVideosData.filter(v => v.course === courseName).map((v, idx) => ({
                    id: `course_${courseName.replace(/\s/g, '_')}_${idx}`,
                    video_url: v.video_url,
                    creator_name: "Educational Channel",
                    caption: v.caption,
                    course: v.course,
                    level: "",
                    semester: "",
                    likes: localLikes.get(`course_${courseName.replace(/\s/g, '_')}_${idx}`) || 0,
                    views: localViews.get(`course_${courseName.replace(/\s/g, '_')}_${idx}`) || 0,
                    source: 'course'
                }));
            }
            
            function formatNumber(num) {
                if (num >= 1e6) return (num/1e6).toFixed(1)+'M';
                if (num >= 1e3) return (num/1e3).toFixed(1)+'k';
                return num;
            }
            
            // New: forward/backward functions
            function seekVideo(reel, delta) {
                const video = reel.querySelector('video');
                if (video) {
                    let newTime = video.currentTime + delta;
                    newTime = Math.max(0, Math.min(video.duration, newTime));
                    video.currentTime = newTime;
                    // Vibration if supported
                    if (navigator.vibrate) navigator.vibrate(50);
                    return;
                }
                const iframe = reel.querySelector('iframe');
                if (iframe && iframe.id) {
                    const player = ytPlayers.get(iframe.id);
                    if (player && typeof player.seekTo === 'function') {
                        player.getCurrentTime().then(current => {
                            let newTime = current + delta;
                            newTime = Math.max(0, newTime);
                            player.seekTo(newTime, true);
                            if (navigator.vibrate) navigator.vibrate(50);
                        }).catch(() => {
                            // fallback
                            player.seekTo(delta > 0 ? 10 : 0, true);
                            if (navigator.vibrate) navigator.vibrate(50);
                        });
                    }
                }
            }


            // Tap the video itself to pause/resume, TikTok-style — sound stays on either way
            function toggleReelPlayback(reel) {
                const iframe = reel.querySelector('iframe');
                const playOverlay = reel.querySelector('.play-overlay');
                if (!iframe || !iframe.id) return;
                const player = ytPlayers.get(iframe.id);
                if (!player) return;
                const state = player.getPlayerState ? player.getPlayerState() : null;
                const isPlaying = state === 1; // YT.PlayerState.PLAYING
                if (isPlaying) {
                    if (player.pauseVideo) player.pauseVideo();
                    if (playOverlay) playOverlay.classList.remove('hidden');
                } else {
                    if (player.playVideo) player.playVideo();
                    if (isManuallyUnmuted) player.unMute();
                    else player.mute();
                    if (playOverlay) playOverlay.classList.add('hidden');
                }
                if (!userInteracted) userInteracted = true;
            }
            
            function updateMuteButtonIcon(reelElement) {
                if (!reelElement) return;
                const muteBtn = reelElement.querySelector('.mute-btn');
                if (muteBtn) muteBtn.textContent = isManuallyUnmuted ? '🔊' : '🔇';
            }
            
            function updateAllMuteButtons() {
                document.querySelectorAll('.reel-item').forEach(reel => updateMuteButtonIcon(reel));
            }
            
            function applyAudioToReel(reelElement, isActive) {
                if (!reelElement) return;
                const iframe = reelElement.querySelector('iframe');
                const playOverlay = reelElement.querySelector('.play-overlay');
                if (!iframe || !iframe.id) return;
                const player = ytPlayers.get(iframe.id);

                if (!isActive) {
                    if (player && player.pauseVideo) player.pauseVideo();
                    if (playOverlay) playOverlay.classList.remove('hidden');
                    return;
                }
                // Active: always auto-play with sound already on — no tap needed
                if (player && player.playVideo) {
                    player.playVideo();
                    if (isManuallyUnmuted) player.unMute();
                    else player.mute();
                }
                if (playOverlay) playOverlay.classList.add('hidden');
            }
            
            function setActiveReel(newReelElement) {
                if (activeReelElement === newReelElement) return;
                if (activeReelElement) applyAudioToReel(activeReelElement, false);
                activeReelElement = newReelElement;
                if (activeReelElement) {
                    applyAudioToReel(activeReelElement, true);
                    updateMuteButtonIcon(activeReelElement);
                }
            }
            
            function toggleManualMute() {
                if (!userInteracted) userInteracted = true;
                isManuallyUnmuted = !isManuallyUnmuted;
                updateAllMuteButtons();
                if (activeReelElement) applyAudioToReel(activeReelElement, true);
            }
            
            async function countViewForReel(reelElement) {
                const id = reelElement.dataset.id;
                const source = reelElement.dataset.source;
                if (!id) return;
                if (source === 'course') {
                    if (localViews.has(id)) localViews.set(id, localViews.get(id) + 1);
                    else localViews.set(id, 1);
                    const viewsSpan = reelElement.querySelector('.overlay-btn:last-child span');
                    if (viewsSpan) viewsSpan.textContent = formatNumber(localViews.get(id));
                    return;
                }
                if (viewCountedSet.has(id)) return;
                viewCountedSet.add(id);
                try {
                    const res = await fetch(`/api/videos/${id}/view`, { method: 'POST', credentials: 'include' });
                    const data = await res.json();
                    const viewsSpan = reelElement.querySelector('.overlay-btn:last-child span');
                    if (viewsSpan) viewsSpan.textContent = formatNumber(data.views);
                } catch (err) { console.error('View increment failed', err); }
            }
            
            // Scroll-driven active-reel detection: whichever reel is centered in the
            // container is the one that plays. Polled every animation frame rather than
            // on the 'scroll' event, since some embedded/automated webviews don't fire
            // scroll events for programmatic or momentum scrolling reliably.
            let scrollTrackingActive = false;
            function updateActiveReelFromScroll() {
                const reels = document.querySelectorAll('.reel-item');
                if (!reels.length) return;
                const containerRect = reelContainer.getBoundingClientRect();
                const containerMid = containerRect.top + containerRect.height / 2;
                let closest = null, closestDist = Infinity;
                reels.forEach(reel => {
                    const rect = reel.getBoundingClientRect();
                    const mid = rect.top + rect.height / 2;
                    const dist = Math.abs(mid - containerMid);
                    if (dist < closestDist) { closestDist = dist; closest = reel; }
                });
                if (closest && closest !== activeReelElement) {
                    setActiveReel(closest);
                    countViewForReel(closest);
                }
            }
            function reelScrollTrackLoop() {
                if (!scrollTrackingActive) return;
                updateActiveReelFromScroll();
                requestAnimationFrame(reelScrollTrackLoop);
            }
            function initReelScrollTracking() {
                activeReelElement = null;
                scrollTrackingActive = true;
                reelScrollTrackLoop();
            }
            function stopReelScrollTracking() {
                scrollTrackingActive = false;
            }

            function onFirstUserInteraction() {
                if (userInteracted) return;

                            <div class="video-overlay-right">
                                <button class="overlay-btn mute-btn">${isManuallyUnmuted ? '🔊' : '🔇'}</button>
                                <button class="overlay-btn like-btn" data-id="${item.id}">❤️ <span class="like-count">${formatNumber(likesCount)}</span></button>
                                <div class="overlay-btn">👁️ <span>${formatNumber(viewsCount)}</span></div>
                            </div>
                        </div>`;
                    });
                    reelContainer.innerHTML = html;
                    // Initialize YouTube players
                    document.querySelectorAll('iframe[id^="yt-"]').forEach(iframe => {
                        if (ytReady) initYouTubePlayer(iframe.id);
                        else ytQueue.push(iframe.id);
                    });
                    attachReelListeners();
                    // Tap anywhere on the video to pause/resume, TikTok-style
                    document.querySelectorAll('.reel-media').forEach(media => {
                        media.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const reel = media.closest('.reel-item');
                            toggleReelPlayback(reel);
                        });
                    });
                    viewCountedSet.clear();
                    initReelScrollTracking();
                    updateAllMuteButtons();
                } else {
                    // Course selection UI
                    stopReelScrollTracking();
                    let courseOptions = uniqueCourses.map(c => `<option value="${c.replace(/"/g, '&quot;')}">${c}</option>`).join('');
                    reelContainer.innerHTML = `
                        <div class="youtube-course-panel">
                            <div class="search-prompt-icon">📚🎓</div>
                            <div class="course-selector-box">
                                <select id="courseSelect">
                                    <option value="">-- Select a course --</option>
                                    ${courseOptions}
                                </select>
                                <button id="loadCourseBtn">Load Videos</button>
                            </div>
                            <div class="search-prompt-text">Choose a course to watch educational reels</div>
                        </div>
                    `;
                    const courseSelect = document.getElementById('courseSelect');
                    const loadBtn = document.getElementById('loadCourseBtn');
                    if (loadBtn && courseSelect) {
                        loadBtn.addEventListener('click', () => {
                            const selected = courseSelect.value;
                            if (!selected) return;
                            selectedCourseVideos = getCourseVideos(selected);
                            renderReel();
                        });
                    }
                    activeReelElement = null;
                }
            }
            
            function attachReelListeners() {
                document.querySelectorAll('.like-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        const id = btn.dataset.id;
                        const reelDiv = btn.closest('.reel-item');
                        const source = reelDiv?.dataset.source;
                        if (source === 'course') {
                            let currentLikes = localLikes.get(id) || 0;
                            currentLikes++;
                            localLikes.set(id, currentLikes);
                            btn.querySelector('.like-count').textContent = formatNumber(currentLikes);
                            btn.classList.add('liked');
                            return;
                        }
                        try {
                            const res = await fetch(`/api/videos/${id}/like`, { method: 'POST', credentials: 'include' });
                            const data = await res.json();
                            btn.querySelector('.like-count').textContent = formatNumber(data.likes);
                            btn.classList.add('liked');
                        } catch (err) { console.error('Like failed', err); }
                    });
                });
                document.querySelectorAll('.mute-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => { e.stopPropagation(); toggleManualMute(); });
                });
                document.querySelectorAll('.transport-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const delta = parseInt(btn.dataset.seek, 10);
                        const reel = btn.closest('.reel-item');
                        if (reel) seekVideo(reel, delta);
                    });
                });
            }
            
            window.backToCourses = function() {
                selectedCourseVideos = [];
                renderReel();
            };
            window.goBack = () => window.history.back();

            renderReel();
        })();
    </script>
</body>
</html>
