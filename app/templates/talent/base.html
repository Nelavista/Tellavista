<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{% block title %}Nelavista Talent | Hire Skilled African Talent{% endblock %}</title>
  <meta name="description" content="{% block description %}Hire vetted, assessed and work-ready professionals across Africa for remote teams, outsourcing and project-based work. Tell us what you need and receive a curated shortlist.{% endblock %}">
  {% block robots %}{% endblock %}
  <link rel="canonical" href="{% block canonical %}{{ request.base_url }}{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Nelavista Talent">
  <meta property="og:title" content="{{ self.title() | trim }}">
  <meta property="og:description" content="{{ self.description() | trim }}">
  <meta property="og:url" content="{{ request.base_url }}">
  <meta property="og:image" content="{% block og_image %}{{ tn.photo_src('hero', 1200, 630) }}{% endblock %}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/x-icon" href="/static/icons/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/nelavista-180x180.png">
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/talent.css') }}">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  {% block head_extra %}{% endblock %}
</head>
<body class="tx {% block body_class %}{% endblock %}">
  <a class="tx-skip" href="#main">Skip to content</a>
  {% include 'talent/_nav.html' %}
  <main id="main">
    {% block content %}{% endblock %}
  </main>
  {% include 'talent/_footer.html' %}
  {% block mobile_cta %}{% endblock %}
  <script src="{{ url_for('static', filename='js/talent.js') }}" defer></script>
</body>
</html>
