<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#1535A8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/brand/nelavista-mark.png" type="image/png" />
    <title>Nelavista Admin</title>
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgb(0 0 0 / 38%);
        backdrop-filter: blur(2px);
      }
      #boot-loader img {
        width: 96px;
        height: 96px;
        object-fit: contain;
      }
      #boot-loader .still {
        display: none;
        width: 56px;
        height: 56px;
        border-radius: 4px;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader .anim {
          display: none;
        }
        #boot-loader .still {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-loader" role="status" aria-label="Loading Nelavista Admin">
        <img alt="" class="anim" height="96" src="/media/nelavista-loader.webp" width="96" />
        <img alt="" class="still" height="56" src="/brand/nelavista-mark.png" width="56" />
      </div>
    </div>
    <noscript>Nelavista Admin needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
