# Alembic config. The URL is taken from settings (DATABASE_URL) in migrations/env.py —
# never hardcoded here.
[alembic]
# %(here)s is this file's directory (apps/api). Without it, running
# `alembic -c apps/api/alembic.ini` from the repo root resolves `migrations`
# to V1's root migrations/ and imports Flask instead of V2's env.py.
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
version_path_separator = os
# Timestamp-prefixed, slugged revision ids keep history readable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
