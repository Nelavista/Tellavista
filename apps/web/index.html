<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1535A8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/brand/nelavista-mark.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Nelavista</title>
    <style>
      #boot-loader {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        background: #1535a8;
        color: #ffffff;
        font-family: 'IBM Plex Mono', Consolas, monospace;
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      #boot-loader .stage {
        display: grid;
        width: 128px;
        height: 128px;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.06);
      }
      #boot-loader img {
        width: 96px;
        height: 96px;
        object-fit: contain;
      }
      #boot-loader .still {
        display: none;
        width: 56px;
        height: 56px;
        border-radius: 4px;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader .anim {
          display: none;
        }
        #boot-loader .still {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-loader" role="status" aria-label="Loading Nelavista">
        <span class="stage">
          <img alt="" class="anim" height="96" src="/media/nelavista-loader.webp" width="96" />
          <img alt="" class="still" height="56" src="/brand/nelavista-mark.png" width="56" />
        </span>
        <span>Loading Nelavista</span>
      </div>
    </div>
    <noscript>Nelavista needs JavaScript enabled to open the workspace.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
