<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1535A8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/brand/nelavista-mark.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Nelavista - Learn it, prove it, get paid for it</title>
    <meta
      name="description"
      content="A working record for Nigerian university students: courses, CBT practice, verified skills and paid work in one place."
    />
    <link rel="canonical" href="https://nelavista.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nelavista" />
    <meta property="og:title" content="Nelavista - Learn it, prove it, get paid for it" />
    <meta
      property="og:description"
      content="A working record for Nigerian university students: courses, CBT practice, verified skills and paid work in one place."
    />
    <meta property="og:url" content="https://nelavista.com/" />
    <meta property="og:image" content="https://nelavista.com/og/og-main.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nelavista working record illustration" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nelavista - Learn it, prove it, get paid for it" />
    <meta
      name="twitter:description"
      content="A working record for Nigerian university students: courses, CBT practice, verified skills and paid work in one place."
    />
    <meta name="twitter:image" content="https://nelavista.com/og/og-main.jpg" />
    <meta name="twitter:image:alt" content="Nelavista working record illustration" />
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgb(0 0 0 / 38%);
        backdrop-filter: blur(2px);
      }
      #boot-loader img {
        width: 144px;
        height: 144px;
        object-fit: contain;
      }
      #boot-loader .still {
        display: none;
        width: 84px;
        height: 84px;
        border-radius: 100%;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader .anim {
          display: none;
        }
        #boot-loader .still {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-loader" role="status" aria-label="Loading Nelavista">
        <img alt="" class="anim" height="144" src="/media/nelavista-loader.webp" width="144" />
        <img alt="" class="still" height="84" src="/brand/nelavista-mark.png" width="84" />
      </div>
    </div>
    <noscript>Nelavista needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
