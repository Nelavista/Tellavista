[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    smoke: whole-app route sweep (tests/test_route_smoke.py)
    slow: takes longer than ~30s
    external: would talk to a third-party service if not blocked

# Note on running the whole platform:
#   pytest                                  -- everything
#   pytest -m smoke                         -- just the feature-wide route sweep
#   pytest --cov=app --cov-report=term-missing   -- coverage (pytest-cov is in requirements-dev.txt)
#
# tests/conftest.py sets SKIP_DB_INIT=1 before importing anything under app/, so no test run
# reads or writes the database in DATABASE_URL. Keep it that way -- see that file's docstring.
