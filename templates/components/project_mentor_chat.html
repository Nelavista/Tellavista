<div class="sk-panel">
  <div class="sk-section-title" style="margin-top:0;"><i class="ri-sparkling-2-line"></i> AI Mentor</div>
  <p class="sk-card-desc">Ask questions, get unstuck, sanity-check your approach. Your mentor guides you — it won't build it for you.</p>

  <div class="chat-bubbles" id="mentorMessages">
    {% for m in project.messages %}
      <div class="chat-bubble {{ 'mine' if m.role == 'user' else 'theirs' }}">{{ m.body }}</div>
    {% else %}
      <p class="sk-card-desc">Ask your mentor anything about this project.</p>
    {% endfor %}
  </div>

  <form id="mentorForm" class="chat-input-row" onsubmit="return pdMentorSend(event)">
    <input class="sk-input" id="mentorInput" placeholder="Ask your mentor..." autocomplete="off">
    <button type="submit" class="sk-btn"><i class="ri-send-plane-fill"></i></button>
  </form>
</div>

<script>
  function pdMentorBubble(text, mine) {
    const messages = document.getElementById('mentorMessages');
    const emptyMsg = messages.querySelector('.sk-card-desc');
    if (emptyMsg) emptyMsg.remove();
    const div = document.createElement('div');
    div.className = 'chat-bubble ' + (mine ? 'mine' : 'theirs');
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  async function pdMentorSend(e) {
    e.preventDefault();
    const input = document.getElementById('mentorInput');
    const text = input.value.trim();
    if (!text) return false;
    pdMentorBubble(text, true);
    input.value = '';
    const thinking = pdMentorBubble('...', false);

    try {
      const res = await fetch(window.location.pathname + '/mentor', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      thinking.remove();
      pdMentorBubble(data.success ? data.reply : ('Mentor is unavailable right now: ' + (data.error || 'try again shortly.')), false);
    } catch (err) {
      thinking.remove();
      pdMentorBubble('Network error, try again.', false);
    }
    return false;
  }
</script>
