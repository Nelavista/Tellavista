<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Nelavista · Academic Archive</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
        body { background:#0d1117; color:#e6edf3; overflow-x:hidden; min-height:100vh; }

        /* ===== TOP BAR ===== */
        .app-container { max-width:1400px; margin:0 auto; padding:0 24px 80px; }
        .top-bar { display:flex; align-items:center; justify-content:space-between; padding:16px 0 20px; border-bottom:1px solid #21262d; margin-bottom:28px; gap:12px; flex-wrap:wrap; }
        .left-area { display:flex; align-items:center; gap:16px; }
        .menu-btn { background:transparent; border:none; color:#e6edf3; font-size:22px; cursor:pointer; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; transition:background 0.2s; }
        .menu-btn:hover { background:#21262d; }
        .logo-area { display:flex; align-items:baseline; gap:8px; }
        .logo-text { font-size:1.4rem; font-weight:700; background:linear-gradient(135deg,#e6edf3,#58a6ff); -webkit-background-clip:text; background-clip:text; color:transparent; letter-spacing:-0.3px; }
        .logo-badge { font-size:0.68rem; background:#14b8a6; padding:2px 8px; border-radius:30px; font-weight:600; color:#0d1117; }
        .right-area { display:flex; align-items:center; gap:16px; }
        .nav-tabs { display:flex; gap:20px; }
        .nav-tab { background:transparent; border:none; font-size:0.95rem; font-weight:500; color:#8b949e; cursor:pointer; padding:6px 0; border-bottom:2px solid transparent; transition:all 0.2s; }
        .nav-tab.active { color:#e6edf3; border-bottom-color:#58a6ff; }
        .nav-tab:hover:not(.active) { color:#c9d1d9; }
        .user-avatar { width:38px; height:38px; background:#21262d; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.85rem; color:#58a6ff; border:1px solid #30363d; cursor:pointer; flex-shrink:0; }
        .edit-courses-btn { background:transparent; border:1px solid #30363d; color:#8b949e; padding:6px 14px; border-radius:30px; font-size:0.78rem; cursor:pointer; transition:all 0.2s; white-space:nowrap; }
        .edit-courses-btn:hover { border-color:#58a6ff; color:#58a6ff; }

        /* ===== HERO / SEARCH ===== */
        .hero-section { margin-bottom:28px; }
        .hero-title { font-size:1.9rem; font-weight:700; letter-spacing:-0.02em; margin-bottom:6px; }
        .hero-sub { color:#8b949e; margin-bottom:22px; font-size:0.95rem; }
        .search-wrapper { position:relative; margin-bottom:18px; }
        .search-icon { position:absolute; left:16px; top:50%; transform:translateY(-50%); color:#8b949e; font-size:17px; pointer-events:none; }
        #searchInput { width:100%; padding:13px 16px 13px 46px; background:#161b22; border:1px solid #30363d; border-radius:40px; font-size:0.95rem; color:#e6edf3; outline:none; transition:all 0.2s; }
        #searchInput:focus { border-color:#58a6ff; box-shadow:0 0 0 3px rgba(88,166,255,0.15); }
        #searchInput::placeholder { color:#6e7681; }
        .filter-row { display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
        .filter-row::-webkit-scrollbar { display:none; }
        .filter-pill { background:#21262d; border:none; padding:7px 18px; border-radius:30px; font-size:0.82rem; font-weight:500; color:#8b949e; cursor:pointer; white-space:nowrap; transition:all 0.2s; flex-shrink:0; }
        .filter-pill.active { background:#58a6ff; color:#fff; }
        .filter-pill:hover:not(.active) { background:#30363d; color:#e6edf3; }

        /* ===== COURSE FILTER ===== */
        .course-filter-row { margin-bottom:14px; }
        #courseFilterSelect { background:#161b22; border:1px solid #30363d; border-radius:30px; color:#e6edf3; padding:9px 16px; font-size:0.85rem; outline:none; max-width:100%; }
        #courseFilterSelect:focus { border-color:#58a6ff; }

        /* ===== GOOGLE SEARCH STATUS ===== */
        .google-status { display:flex; align-items:center; gap:8px; margin-bottom:12px; padding:8px 16px; background:#161b22; border-radius:40px; border:1px solid #30363d; }
        .google-status .status-icon { font-size:14px; }
        .google-status .status-text { font-size:0.8rem; color:#8b949e; }
        .google-status.loading .status-text { color:#58a6ff; }
        .google-status.success .status-icon { color:#14b8a6; }
        .refresh-google-btn { margin-left:auto; background:transparent; border:1px solid #30363d; color:#8b949e; padding:4px 12px; border-radius:30px; font-size:0.7rem; cursor:pointer; transition:all 0.2s; }
        .refresh-google-btn:hover { border-color:#58a6ff; color:#58a6ff; }
        .refresh-google-btn:disabled { opacity:0.5; cursor:not-allowed; }

        /* ===== MATERIALS GRID ===== */
        .materials-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
        @media(max-width:1024px){ .materials-grid { grid-template-columns:repeat(2,1fr); } }
        @media(max-width:640px){ .materials-grid { grid-template-columns:1fr; } }

        .material-card { background:#161b22; border:1px solid #21262d; border-radius:16px; padding:18px; display:flex; flex-direction:column; cursor:pointer; transition:all 0.2s; position:relative; }
        .material-card:hover { border-color:#58a6ff; box-shadow:0 6px 20px rgba(88,166,255,0.08); transform:translateY(-2px); }
        .material-card.google-source { border-left:3px solid #14b8a6; }
        .card-top { display:flex; gap:12px; align-items:flex-start; margin-bottom:10px; }
        .material-icon { font-size:26px; flex-shrink:0; }
        .material-title { font-weight:600; font-size:0.95rem; line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        .dept-tag { font-size:0.72rem; color:#58a6ff; background:rgba(88,166,255,0.1); padding:3px 10px; border-radius:30px; display:inline-block; margin-bottom:10px; width:fit-content; }
        .meta-row { display:flex; justify-content:space-between; font-size:0.68rem; color:#6e7681; margin-bottom:10px; }
        .badge { font-size:0.62rem; font-weight:700; padding:3px 8px; border-radius:30px; display:inline-block; width:fit-content; letter-spacing:0.3px; }
        .source-badge { font-size:0.6rem; font-weight:600; padding:2px 8px; border-radius:30px; display:inline-flex; align-items:center; gap:4px; margin-left:8px; }
        .source-badge.web { background:rgba(20,184,166,0.15); color:#14b8a6; border:1px solid rgba(20,184,166,0.3); }
        .source-badge.uploaded { background:rgba(88,166,255,0.15); color:#58a6ff; border:1px solid rgba(88,166,255,0.3); }
        .source-badge.static { background:rgba(107,114,128,0.15); color:#8b949e; border:1px solid rgba(107,114,128,0.3); }
        .card-bottom { display:flex; justify-content:space-between; align-items:center; margin-top:auto; padding-top:12px; border-top:1px solid #21262d; }
        .pdf-label { font-size:0.68rem; color:#6e7681; }
        .card-icons { display:flex; gap:14px; }
        .card-icons span { cursor:pointer; font-size:17px; transition:opacity 0.2s; }
        .card-icons span:hover { opacity:0.6; }

        .empty-state { grid-column:1/-1; text-align:center; padding:60px 20px; color:#6e7681; font-size:0.95rem; }

        /* ===== AI ACTIONS (cards + viewer) ===== */
        .card-desc { font-size:0.75rem; color:#8b949e; margin-bottom:10px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        .card-date { font-size:0.65rem; color:#6e7681; }
        .ai-actions-row { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
        .ai-action-btn { background:transparent; border:1px solid #30363d; color:#58a6ff; padding:5px 10px; border-radius:8px; font-size:0.68rem; cursor:pointer; transition:all 0.15s; }
        .ai-action-btn:hover { border-color:#58a6ff; }
        .ai-result-box { display:none; margin-top:10px; padding:10px 12px; background:rgba(88,166,255,0.08); border-radius:10px; font-size:0.78rem; line-height:1.55; color:#c9d1d9; }
        .ai-result-box.show { display:block; }
        .viewer-ai-row { display:flex; gap:8px; padding:12px 24px; background:#0d1117; border-top:1px solid #21262d; flex-wrap:wrap; }
        .viewer-ai-btn { background:#21262d; border:1px solid #30363d; color:#58a6ff; padding:8px 14px; border-radius:20px; font-size:0.8rem; cursor:pointer; }
        .viewer-ai-btn:hover { border-color:#58a6ff; }
        .viewer-ai-result { display:none; margin:0 24px 16px; padding:14px 16px; background:#161b22; border-radius:12px; font-size:0.85rem; line-height:1.6; max-height:200px; overflow-y:auto; }
        .viewer-ai-result.show { display:block; }

        /* ===== ONBOARDING ===== */
        .onboarding-screen { position:fixed; inset:0; background:#0d1117; z-index:2000; overflow-y:auto; padding:32px 20px 80px; }
        .onboarding-inner { max-width:860px; margin:0 auto; }
        .onboarding-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
        .onboarding-title { font-size:1.8rem; font-weight:700; }
        .onboarding-sub { color:#8b949e; margin-top:6px; font-size:0.92rem; }
        .onboarding-meta { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin:16px 0 24px; }
        .dept-pill { background:#161b22; border:1px solid #30363d; padding:6px 16px; border-radius:30px; font-size:0.85rem; color:#8b949e; }
        .select-all-btn { background:transparent; border:none; color:#58a6ff; font-size:0.85rem; cursor:pointer; padding:4px 0; }
        .select-all-btn:hover { text-decoration:underline; }

        .section-label { font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:#6e7681; margin:20px 0 12px; padding-bottom:8px; border-bottom:1px solid #21262d; }

        .courses-grid { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:8px; }
        .course-chip { background:#161b22; border:2px solid #21262d; border-radius:14px; padding:14px 16px; cursor:pointer; transition:all 0.18s; min-width:160px; flex:1 0 auto; max-width:220px; position:relative; }
        .course-chip:hover { border-color:#30363d; background:#1c2129; }
        .course-chip.selected { background:rgba(20,184,166,0.1); border-color:#14b8a6; }
        .chip-code { font-weight:700; font-size:0.95rem; color:#e6edf3; }
        .chip-name { font-size:0.72rem; color:#8b949e; margin-top:4px; line-height:1.3; }
        .chip-check { position:absolute; top:10px; right:10px; color:#14b8a6; font-size:14px; font-weight:700; opacity:0; transition:opacity 0.15s; }
        .course-chip.selected .chip-check { opacity:1; }

        .selected-count { font-size:0.82rem; color:#8b949e; margin-bottom:20px; }
        .selected-count span { color:#14b8a6; font-weight:600; }

        .continue-btn { background:#14b8a6; border:none; padding:15px 28px; border-radius:40px; font-weight:700; font-size:1rem; color:#0d1117; width:100%; cursor:pointer; transition:all 0.2s; position:sticky; bottom:20px; }
        .continue-btn:disabled { opacity:0.35; cursor:not-allowed; }
        .continue-btn:not(:disabled):hover { background:#0d9488; }

        /* ===== FAB ===== */
        .fab { position:fixed; bottom:28px; right:24px; background:#14b8a6; width:54px; height:54px; border-radius:50%; border:none; font-size:26px; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 16px rgba(20,184,166,0.35); z-index:100; transition:transform 0.15s; }
        .fab:hover { transform:scale(1.04); }

        /* ===== PDF VIEWER MODAL ===== */
        .viewer-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); backdrop-filter:blur(8px); z-index:4000; }
        .viewer-modal.show { display:flex; flex-direction:column; }
        .viewer-header { display:flex; justify-content:space-between; align-items:center; padding:16px 24px; background:#161b22; border-bottom:1px solid #30363d; }
        .viewer-title { font-size:1rem; font-weight:600; color:#e6edf3; max-width:70%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .viewer-actions { display:flex; gap:16px; }
        .viewer-btn { background:transparent; border:none; color:#8b949e; font-size:18px; cursor:pointer; padding:8px; border-radius:8px; transition:all 0.2s; }
        .viewer-btn:hover { background:#21262d; color:#e6edf3; }

        /* ===== PDF LOADING STATE ===== */
        .viewer-content { flex:1; position:relative; display:flex; align-items:center; justify-content:center; }
        .viewer-frame { position:absolute; width:100%; height:100%; border:none; opacity:0; transition:opacity 0.4s ease-in; }
        .viewer-frame.loaded { opacity:1; }

        .pdf-loader { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#0d1117; pointer-events:none; opacity:1; transition:opacity 0.4s ease-out; }
        .pdf-loader.hidden { opacity:0; }

        .skeleton-container { width:90%; max-width:800px; }
        .skeleton-header { height:12px; background:linear-gradient(90deg, #21262d 25%, #30363d 50%, #21262d 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:6px; margin-bottom:24px; width:60%; }
        .skeleton-line { height:8px; background:linear-gradient(90deg, #21262d 25%, #30363d 50%, #21262d 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:4px; margin-bottom:12px; }
        .skeleton-line:nth-child(2) { width:95%; }
        .skeleton-line:nth-child(3) { width:88%; }
        .skeleton-line:nth-child(4) { width:92%; }
        .skeleton-line:nth-child(5) { width:78%; }
        .skeleton-line:nth-child(6) { width:85%; }

        .loader-text { margin-top:32px; color:#58a6ff; font-size:0.9rem; font-weight:500; display:flex; align-items:center; gap:10px; }
        .loader-spinner { width:16px; height:16px; border:2px solid #30363d; border-top-color:#58a6ff; border-radius:50%; animation:spin 0.8s linear infinite; }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        @keyframes spin { to { transform:rotate(360deg); } }

        .viewer-footer { padding:12px 24px; background:#161b22; border-top:1px solid #30363d; display:flex; justify-content:center; }
        .viewer-source-badge { display:flex; align-items:center; gap:6px; font-size:0.75rem; }

        /* ===== UPLOAD MODAL ===== */
        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(6px); z-index:3000; align-items:center; justify-content:center; }
        .modal.show { display:flex; }
        .modal-card { background:#161b22; border:1px solid #30363d; border-radius:24px; width:92%; max-width:520px; max-height:88vh; overflow-y:auto; padding:26px; }
        .modal-card h3 { font-size:1.4rem; font-weight:700; margin-bottom:18px; }
        .upload-form label { display:block; font-size:0.8rem; color:#8b949e; margin-bottom:6px; font-weight:500; }
        .upload-form .fg { margin-bottom:14px; }
        .upload-form input, .upload-form select, .upload-form textarea { width:100%; background:#0d1117; border:1px solid #30363d; padding:11px 14px; border-radius:12px; color:#e6edf3; font-size:0.9rem; outline:none; transition:border 0.2s; }
        .upload-form input:focus, .upload-form select:focus { border-color:#58a6ff; }
        .upload-form textarea { resize:vertical; min-height:72px; }
        .upload-submit-btn { background:#58a6ff; border:none; padding:13px; border-radius:40px; font-weight:700; font-size:0.95rem; width:100%; cursor:pointer; color:#0d1117; margin-top:6px; transition:opacity 0.2s; }
        .upload-submit-btn:hover { opacity:0.88; }
        .modal-cancel { margin-top:10px; width:100%; background:transparent; border:1px solid #30363d; color:#8b949e; padding:10px; border-radius:40px; cursor:pointer; font-size:0.88rem; transition:all 0.2s; }
        .modal-cancel:hover { border-color:#58a6ff; color:#58a6ff; }
        .upload-progress { display:none; background:#21262d; border-radius:4px; overflow:hidden; margin:8px 0; }
        .upload-progress-fill { width:0%; height:4px; background:#58a6ff; transition:width 0.3s; }

        /* ===== LOADING SPINNER ===== */
        .loading-spinner { display:inline-block; width:14px; height:14px; border:2px solid #30363d; border-top-color:#58a6ff; border-radius:50%; animation:spin 0.8s linear infinite; }

        @media(max-width:600px) {
            .top-bar { flex-direction:column; align-items:stretch; }
            .left-area { justify-content:space-between; }
            .right-area { justify-content:space-between; flex-wrap:wrap; row-gap:8px; }
            /* Study/Pulse are "coming soon" stubs and Library is already the page
               you're on -- not worth the width on a small screen. */
            .nav-tabs { display:none; }
            .edit-courses-btn { font-size:0.72rem; padding:6px 10px; }
            #courseFilterSelect { width:100%; }
        }
    </style>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <script src="{{ url_for('static', filename='js/csrf.js') }}"></script>
</head>
<body>

<!-- PDF Viewer Modal -->
<div id="pdfViewerModal" class="viewer-modal">
    <div class="viewer-header">
        <span class="viewer-title" id="viewerTitle">Document Title</span>
        <div class="viewer-actions">
            <button class="viewer-btn" onclick="downloadCurrentMaterial()" title="Download">⬇️</button>
            <button class="viewer-btn" onclick="closePdfViewer()" title="Close">✕</button>
        </div>
    </div>
    <div class="viewer-content">
        <!-- Loading skeleton -->
        <div class="pdf-loader" id="pdfLoader">
            <div class="skeleton-container">
                <div class="skeleton-header"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line"></div>
            </div>
            <div class="loader-text">
                <div class="loader-spinner"></div>
                <span>Loading PDF...</span>
            </div>
        </div>
        <!-- PDF iframe -->
        <iframe id="pdfViewerFrame" class="viewer-frame"></iframe>
    </div>
    <div class="viewer-ai-row">
        <button class="viewer-ai-btn" onclick="askAboutCurrentMaterial('explain')">💡 Explain this</button>
        <button class="viewer-ai-btn" onclick="askAboutCurrentMaterial('summarize')">📝 Summarize this</button>
        <button class="viewer-ai-btn" onclick="askAboutCurrentMaterial('quiz')">❓ Quiz me</button>
    </div>
    <div class="viewer-ai-result" id="viewerAiResult"></div>
    <div class="viewer-footer">
        <div class="viewer-source-badge" id="viewerSourceBadge"></div>
    </div>
</div>

<!-- main app -->
<div id="mainApp">
    <div class="app-container">
        <div class="top-bar">
            <div class="left-area">
                <button class="menu-btn" id="menuBtn">☰</button>
                <div class="logo-area">
                    <span class="logo-text">Academic Archive</span>
                    <span class="logo-badge">Nelavista</span>
                </div>
            </div>
            <div class="right-area">
                <div class="nav-tabs">
                    <button class="nav-tab active" data-tab="library">Library</button>
                    <button class="nav-tab" data-tab="study">Study</button>
                    <button class="nav-tab" data-tab="pulse">Pulse</button>
                </div>
                <a href="/search" class="edit-courses-btn" style="text-decoration:none;">🔍 Search Academia</a>
                <div class="user-avatar">{{ user.name[:2].upper() if user.name else 'SN' }}</div>
            </div>
        </div>

        <div class="hero-section">
            <h1 class="hero-title">Find your next breakthrough.</h1>
            <p class="hero-sub" id="heroSub">Materials for your courses, straight from Nelavista.</p>

            <!-- Google Search Status -->
            <div class="google-status" id="googleStatus">
                <span class="status-icon">🌐</span>
                <span class="status-text" id="googleStatusText">Ready to search web for materials</span>
                <button class="refresh-google-btn" id="refreshGoogleBtn" onclick="fetchGoogleMaterials()">🔄 Refresh</button>
            </div>

            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search your materials by title, author, or code…">
            </div>
            <div class="course-filter-row">
                <select id="courseFilterSelect">
                    <option value="">All My Courses</option>
                </select>
            </div>
            <div class="filter-row" id="filterRow">
                <button class="filter-pill active" data-filter="all">All</button>
                <button class="filter-pill" data-filter="PAST QUESTIONS">Past Questions</button>
                <button class="filter-pill" data-filter="TEXTBOOK">Textbooks</button>
                <button class="filter-pill" data-filter="LECTURE NOTES">Lecture Notes</button>
                <button class="filter-pill" data-filter="NOTE">Notes</button>
                <button class="filter-pill" data-filter="STUDY MATERIAL">Study Materials</button>
            </div>
        </div>

        <div class="materials-grid" id="materialsGrid">
            <div class="empty-state">Loading your materials…</div>
        </div>
        <div style="text-align:center; margin-top:20px;">
            <button class="refresh-google-btn" id="loadMoreBtn" style="display:none; padding:10px 24px; font-size:0.85rem;" onclick="loadMaterials(false)">Load more materials</button>
        </div>
    </div>
</div>

<button class="fab" id="fabBtn">+</button>

<!-- Upload Modal -->
<div id="uploadModal" class="modal">
    <div class="modal-card">
        <h3>📤 Share Your PDF</h3>
        <form id="uploadForm" onsubmit="handleUpload(event)" class="upload-form">
            <div class="fg"><label>Title *</label><input type="text" id="materialTitle" placeholder="e.g. BCH 201 – Enzyme Kinetics" required></div>
            <div class="fg"><label>Course *</label>
                <select id="materialCourse" required>
                    <option value="">Select Course</option>
                    <option>Biochemistry</option><option>Mathematics</option><option>Computer Science</option>
                    <option>Biology</option><option>Chemistry</option><option>Physics</option>
                    <option>Accounting</option><option>Agriculture</option><option>Business Administration</option>
                    <option>Information Technology</option><option>Zoology</option>
                    <option>Science Laboratory Technology</option><option>Entrepreneurship</option>
                </select>
            </div>
            <div class="fg"><label>Level *</label>
                <select id="materialLevel" required>
                    <option value="">Select Level</option>
                    <option value="100">100 Level</option><option value="200">200 Level</option>
                    <option value="300">300 Level</option><option value="400">400 Level</option>
                </select>
            </div>
            <div class="fg"><label>Semester *</label>
                <select id="materialSemester" required>
                    <option value="">Select Semester</option>
                    <option value="First Semester">First Semester</option>
                    <option value="Second Semester">Second Semester</option>
                </select>
            </div>
            <div class="fg"><label>Course Code *</label><input type="text" id="materialCode" placeholder="e.g. BCH201" required></div>
            <div class="fg"><label>Author / Your Name</label><input type="text" id="materialAuthor" value="{{ user.name or '' }}"></div>
            <div class="fg"><label>Description (optional)</label><textarea id="materialDesc" placeholder="Brief description…"></textarea></div>
            <div class="fg"><label>PDF File *</label><input type="file" id="materialFile" accept=".pdf" required></div>
            <div class="upload-progress" id="uploadProgress"><div class="upload-progress-fill" id="uploadProgressFill"></div></div>
            <button type="submit" class="upload-submit-btn" id="uploadSubmitBtn">📤 Upload & Share</button>
            <button type="button" class="modal-cancel" onclick="closeUploadModal()">Cancel</button>
        </form>
    </div>
</div>

<script>
// ============================================================
//  JINJA2 VARIABLES
// ============================================================
const userDepartment = "{{ user.department or '' }}";
const userLevel      = "{{ user.level or '' }}";
const userName       = "{{ user.name or 'Student' }}";
const userLevelNum   = userLevel.toString().replace(/[^0-9]/g, '') || '100';
const userSemester   = "{{ user.semester or '' }}";
const userUniversity = "{{ user.university or '' }}";

// ============================================================
//  BADGE HELPER
// ============================================================
function getBadge(title) {
    const t = title.toLowerCase();
    if (t.includes('past question') || t.includes('oer') || t.includes('test') || t.includes('exam') || t.includes('multiple choice') || t.includes('mcq')) return { label:'PAST QUESTIONS', color:'#f97316' };
    if (t.includes('lecture') || t.includes('lesson')) return { label:'LECTURE NOTES', color:'#8b5cf6' };
    if (t.includes('textbook') || t.includes('vol') || t.includes('edition') || t.includes('introduction to') || t.includes('principles of') || t.includes('fundamentals')) return { label:'TEXTBOOK', color:'#3b82f6' };
    if (t.includes('note') || t.includes('compilation') || t.includes('summary')) return { label:'NOTE', color:'#6b7280' };
    return { label:'STUDY MATERIAL', color:'#14b8a6' };
}

function getSourceBadge(source) {
    const badges = {
        'static': { label:'📁 ARCHIVED', class:'static' },
        'uploaded': { label:'📤 UPLOADED', class:'uploaded' },
        'google_auto': { label:'🌐 WEB SOURCE', class:'web' },
        'openstax': { label:'📚 OPENSTAX', class:'web' }
    };
    return badges[source] || { label:'📁 ARCHIVED', class:'static' };
}

// ============================================================
//  STATE
// ============================================================
let currentCourseFilter = '';
let currentFilter = 'all';
let searchQuery = '';
let currentPage = 1;
let hasMoreMaterials = false;
let currentViewingMaterial = null;
let myCourses = [];
let loadedMaterialsById = {};
let searchDebounceTimer = null;

// ============================================================
//  MY COURSES -- same resolver-backed source as the dashboard/course pages
//  (services/academic_context.py via /api/user-courses), not a separate
//  hardcoded curriculum. Populates the course filter dropdown.
// ============================================================
async function loadMyCourses() {
    try {
        const res = await fetch('/api/user-courses');
        const data = await res.json();
        myCourses = data.courses || [];
        const select = document.getElementById('courseFilterSelect');
        myCourses.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.code;
            opt.textContent = c.name;
            select.appendChild(opt);
        });
        if (!myCourses.length) {
            document.getElementById('heroSub').textContent = userDepartment
                ? `We don't have ${userDepartment} ${userLevel} Level courses mapped yet — showing materials tagged for your department instead.`
                : 'Complete your academic profile to see materials matched to your courses.';
        }
    } catch (e) {
        console.error('Failed to load courses', e);
    }
}

function courseTitleFor(code) {
    const c = myCourses.find(c => c.code === code);
    return c ? c.name.replace(code + ' — ', '') : null;
}

// ============================================================
//  GOOGLE / WEB DISCOVERY -- unchanged backend, but now re-loads the real
//  paginated library afterward instead of merging a second, separate array;
//  fetch-google-materials-batch already writes results into the Material
//  table, so refreshing the normal query is all that's needed to show them.
// ============================================================
async function fetchGoogleMaterials() {
    const codes = currentCourseFilter ? [currentCourseFilter] : myCourses.map(c => c.code).slice(0, 5);
    if (!codes.length) {
        updateGoogleStatus('No courses to search for yet', 'idle');
        return;
    }

    updateGoogleStatus('Searching web for materials...', 'loading');
    document.getElementById('refreshGoogleBtn').disabled = true;

    try {
        const response = await fetch('/api/fetch-google-materials-batch', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                course_codes: codes,
                department: userDepartment,
                level: userLevelNum,
                semester: userSemester
            })
        });
        const data = await response.json();

        if (data.success && (data.materials || []).length) {
            updateGoogleStatus(`Found ${data.materials.length} materials`, 'success');
            await loadMaterials(true);
        } else if (data.search_unavailable) {
            updateGoogleStatus('Web search is temporarily down', 'error');
        } else {
            updateGoogleStatus('No new materials found for these courses', 'idle');
        }
    } catch (error) {
        console.error('Google fetch error:', error);
        updateGoogleStatus('Search unavailable', 'error');
    } finally {
        document.getElementById('refreshGoogleBtn').disabled = false;
    }
}

function updateGoogleStatus(text, status) {
    const statusEl = document.getElementById('googleStatus');
    const textEl = document.getElementById('googleStatusText');
    const iconEl = statusEl.querySelector('.status-icon');

    statusEl.className = 'google-status';
    if (status === 'loading') {
        statusEl.classList.add('loading');
        iconEl.innerHTML = '<span class="loading-spinner"></span>';
    } else if (status === 'success') {
        statusEl.classList.add('success');
        iconEl.textContent = '✅';
    } else if (status === 'error') {
        iconEl.textContent = '⚠️';
    } else {
        iconEl.textContent = '🌐';
    }

    textEl.textContent = text;
}

// ============================================================
//  MATERIALS -- the one real, database-backed, paginated source. No client-
//  side merging of static/uploaded/google arrays anymore: everything a
//  student sees here is a real Material row scoped server-side to their own
//  department/level (routes/materials_routes.py::fetch_materials).
// ============================================================
async function loadMaterials(reset) {
    const grid = document.getElementById('materialsGrid');
    const loadMoreBtn = document.getElementById('loadMoreBtn');

    if (reset) {
        currentPage = 1;
        grid.innerHTML = `<div class="empty-state">Loading your materials…</div>`;
    } else {
        currentPage += 1;
    }

    const params = new URLSearchParams({ page: currentPage, per_page: 12 });
    if (currentCourseFilter) params.set('course_code', currentCourseFilter);
    if (searchQuery.trim()) params.set('q', searchQuery.trim());
    if (currentFilter !== 'all') params.set('type', currentFilter);

    try {
        const res = await fetch(`/api/fetch-materials?${params.toString()}`);
        const data = await res.json();
        hasMoreMaterials = !!data.has_more;
        loadMoreBtn.style.display = hasMoreMaterials ? 'inline-block' : 'none';

        const items = data.materials || [];
        items.forEach(m => { loadedMaterialsById[m.id] = m; });

        if (reset) {
            if (!items.length) {
                grid.innerHTML = `<div class="empty-state">${emptyStateMessage()}</div>`;
                return;
            }
            grid.innerHTML = items.map(renderMaterialCard).join('');
        } else if (items.length) {
            grid.insertAdjacentHTML('beforeend', items.map(renderMaterialCard).join(''));
        }
    } catch (e) {
        console.error('Failed to load materials', e);
        if (reset) grid.innerHTML = `<div class="empty-state">Couldn't load materials right now. Please try again.</div>`;
    }
}

function emptyStateMessage() {
    if (currentCourseFilter) {
        return `📭 No materials have been added for ${currentCourseFilter} yet. <a href="#" style="color:#58a6ff;" onclick="event.preventDefault(); openUploadModal();">Upload one →</a>`;
    }
    if (searchQuery.trim()) {
        return `🔍 No materials matched "${searchQuery}" in your library. Try <a href="/search" style="color:#58a6ff;">searching all of Academia →</a>`;
    }
    if (currentFilter !== 'all') {
        return `No "${currentFilter.toLowerCase()}" materials for your courses yet.`;
    }
    return `✨ No materials for your courses yet. <a href="#" style="color:#58a6ff;" onclick="event.preventDefault(); openUploadModal();">Upload the first one →</a>`;
}

// ============================================================
//  RENDER CARD
// ============================================================
function renderMaterialCard(m) {
    const badge = getBadge(m.title || '');
    const sourceBadge = getSourceBadge(m.source);
    const icon = badge.label === 'PAST QUESTIONS' ? '📝' : (badge.label === 'TEXTBOOK' ? '📚' : (badge.label === 'LECTURE NOTES' ? '📖' : '📘'));
    const courseTitle = m.course_code ? courseTitleFor(m.course_code) : null;
    const dateStr = m.created_at ? new Date(m.created_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '';

    return `
        <div class="material-card ${m.source === 'google_auto' ? 'google-source' : ''}" onclick="openMaterialById(${m.id})">
            <div class="card-top">
                <span class="material-icon">${icon}</span>
                <div class="material-title">${m.title || 'Untitled Material'}</div>
            </div>
            <div class="dept-tag">${m.course_code || m.department}${courseTitle ? ' — ' + courseTitle : ''}</div>
            ${m.description ? `<div class="card-desc">${m.description}</div>` : ''}
            <div class="meta-row">
                <span>📄 PDF</span>
                <span class="card-date">${dateStr}</span>
            </div>
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">
                <span class="badge" style="background:${badge.color}22; color:${badge.color}; border:1px solid ${badge.color}44;">${badge.label}</span>
                <span class="source-badge ${sourceBadge.class}">${sourceBadge.label}</span>
            </div>
            <div class="ai-actions-row" onclick="event.stopPropagation();">
                <button class="ai-action-btn" onclick="askAboutCard(${m.id}, 'explain', this)">💡 Explain</button>
                <button class="ai-action-btn" onclick="askAboutCard(${m.id}, 'summarize', this)">📝 Summarize</button>
                <button class="ai-action-btn" onclick="askAboutCard(${m.id}, 'quiz', this)">❓ Quiz me</button>
            </div>
            <div class="ai-result-box" id="card-ai-result-${m.id}" onclick="event.stopPropagation();"></div>
            <div class="card-bottom">
                <span class="pdf-label">📌 ${m.author || m.uploaded_by || 'Unknown'}</span>
                <div class="card-icons">
                    <span title="Download" onclick="event.stopPropagation(); downloadMaterialById(${m.id})">⬇️</span>
                </div>
            </div>
        </div>
    `;
}

// ============================================================
//  AI ACTIONS -- reuses the exact same /api/materials/<id>/ai-action
//  endpoint the course page uses (routes/ai_routes.py). No second AI
//  implementation: same retrieval, same honest-failure behavior.
// ============================================================
async function askAboutCard(materialId, mode, btn) {
    const box = document.getElementById(`card-ai-result-${materialId}`);
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Thinking…';
    box.classList.add('show');
    box.textContent = 'Nelavista is reading this material…';
    try {
        const res = await fetch(`/api/materials/${materialId}/ai-action`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mode })
        });
        const data = await res.json();
        box.innerHTML = data.answer;
    } catch (e) {
        box.textContent = "Couldn't reach Nelavista — please try again.";
    }
    btn.disabled = false;
    btn.textContent = original;
}

async function askAboutCurrentMaterial(mode) {
    if (!currentViewingMaterial || !currentViewingMaterial.id) {
        alert("AI actions aren't available for this item yet.");
        return;
    }
    const box = document.getElementById('viewerAiResult');
    box.classList.add('show');
    box.textContent = 'Nelavista is reading this material…';
    try {
        const res = await fetch(`/api/materials/${currentViewingMaterial.id}/ai-action`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mode })
        });
        const data = await res.json();
        box.innerHTML = data.answer;
    } catch (e) {
        box.textContent = "Couldn't reach Nelavista — please try again.";
    }
}

// ============================================================
//  PDF VIEWER (reader) -- opens by id looked up from the last-rendered page,
//  so no material data has to round-trip through an HTML attribute.
// ============================================================
function openMaterialById(id) {
    const material = loadedMaterialsById[id];
    if (material) openMaterial(material);
}

function openMaterial(material) {
    const link = material.file_url || material.external_url;
    if (!link) return alert('File not available.');

    // Every material in the DB has already been verified embeddable (checked
    // for X-Frame-Options/CSP frame-ancestors headers before being stored --
    // see the cleanup that removed ones that would show "This content is
    // blocked. Contact the site owner to fix the issue."), so everything
    // routes through the in-app iframe viewer below rather than a new tab.
    currentViewingMaterial = material;

    // Real per-student view tracking -- same MaterialView system the
    // dashboard's Continue Studying / Recent Materials and the course page's
    // progress section already read from (services/progress_service.py).
    if (material.id) {
        fetch(`/api/materials/${material.id}/view`, { method: 'POST' }).catch(() => {});
    }

    // Reset iframe, loader, and any previous AI answer
    const iframe = document.getElementById('pdfViewerFrame');
    const loader = document.getElementById('pdfLoader');
    const aiResult = document.getElementById('viewerAiResult');

    iframe.classList.remove('loaded');
    loader.classList.remove('hidden');
    iframe.src = '';
    aiResult.classList.remove('show');
    aiResult.textContent = '';

    document.getElementById('viewerTitle').textContent = material.title || 'Document';

    const sourceBadge = getSourceBadge(material.source);
    document.getElementById('viewerSourceBadge').innerHTML = `
        <span class="source-badge ${sourceBadge.class}">${sourceBadge.label}</span>
        <span style="color:#6e7681;">${material.course_code || ''}</span>
    `;

    document.getElementById('pdfViewerModal').classList.add('show');

    setTimeout(() => {
        iframe.src = link;
        iframe.onload = () => {
            setTimeout(() => {
                loader.classList.add('hidden');
                iframe.classList.add('loaded');
            }, 300);
        };
        setTimeout(() => {
            if (!iframe.classList.contains('loaded')) {
                loader.classList.add('hidden');
                iframe.classList.add('loaded');
            }
        }, 5000);
    }, 100);
}

function closePdfViewer() {
    document.getElementById('pdfViewerModal').classList.remove('show');
    const iframe = document.getElementById('pdfViewerFrame');
    iframe.src = '';
    iframe.classList.remove('loaded');
    document.getElementById('pdfLoader').classList.remove('hidden');
    currentViewingMaterial = null;
}

function downloadCurrentMaterial() {
    if (currentViewingMaterial) {
        downloadMaterial(currentViewingMaterial.file_url || currentViewingMaterial.external_url, currentViewingMaterial.title);
    }
}

function downloadMaterialById(id) {
    const m = loadedMaterialsById[id];
    if (m) downloadMaterial(m.file_url || m.external_url, m.title);
}

function downloadMaterial(link, title) {
    if (!link) return alert('File not available.');
    const a = document.createElement('a');
    a.href = link;
    a.download = (title || 'document').replace(/[^a-z0-9]/gi, '_') + '.pdf';
    a.target = '_blank';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

// ============================================================
//  UPLOAD MODAL
// ============================================================
function openUploadModal() { document.getElementById('uploadModal').classList.add('show'); }
function closeUploadModal() { document.getElementById('uploadModal').classList.remove('show'); }

async function handleUpload(e) {
    e.preventDefault();
    const btn = document.getElementById('uploadSubmitBtn');
    btn.disabled = true;
    btn.textContent = 'Uploading…';
    const progressDiv = document.getElementById('uploadProgress');
    const progressFill = document.getElementById('uploadProgressFill');
    progressDiv.style.display = 'block';

    const formData = new FormData();
    formData.append('file',        document.getElementById('materialFile').files[0]);
    formData.append('title',       document.getElementById('materialTitle').value);
    formData.append('course',      document.getElementById('materialCourse').value);
    formData.append('level',       document.getElementById('materialLevel').value);
    formData.append('semester',    document.getElementById('materialSemester').value);
    formData.append('course_code', document.getElementById('materialCode').value);
    formData.append('author',      document.getElementById('materialAuthor').value);
    formData.append('description', document.getElementById('materialDesc').value);

    try {
        let pct = 0;
        const interval = setInterval(() => { pct = Math.min(pct + 15, 85); progressFill.style.width = pct + '%'; }, 300);

        const res = await fetch('/api/upload-material', { method: 'POST', body: formData });
        clearInterval(interval);
        progressFill.style.width = '100%';
        const data = await res.json();

        if (data.success) {
            closeUploadModal();
            document.getElementById('uploadForm').reset();
            await loadMaterials(true);
        } else {
            alert('Upload failed: ' + (data.error || 'Unknown error'));
        }
    } catch (err) {
        alert('Upload error: ' + err.message);
    } finally {
        btn.disabled = false;
        btn.textContent = '📤 Upload & Share';
        progressDiv.style.display = 'none';
        progressFill.style.width = '0%';
    }
}

window.handleUpload = handleUpload;
window.closeUploadModal = closeUploadModal;
window.closePdfViewer = closePdfViewer;
window.downloadCurrentMaterial = downloadCurrentMaterial;
window.fetchGoogleMaterials = fetchGoogleMaterials;
window.openMaterialById = openMaterialById;
window.downloadMaterialById = downloadMaterialById;
window.askAboutCard = askAboutCard;
window.askAboutCurrentMaterial = askAboutCurrentMaterial;
window.openUploadModal = openUploadModal;
window.loadMaterials = loadMaterials;

// ============================================================
//  INIT -- no onboarding gate: a student's real courses/materials are
//  already known from their profile, so the library loads directly.
// ============================================================
(async function init() {
    await loadMyCourses();
    await loadMaterials(true);

    document.getElementById('searchInput').addEventListener('input', e => {
        searchQuery = e.target.value;
        clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(() => loadMaterials(true), 350);
    });

    document.getElementById('courseFilterSelect').addEventListener('change', e => {
        currentCourseFilter = e.target.value;
        loadMaterials(true);
    });

    document.querySelectorAll('.filter-pill').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            loadMaterials(true);
        });
    });

    document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            if (tab.dataset.tab !== 'library') alert('Coming soon!');
        });
    });

    document.getElementById('menuBtn').onclick = () => window.location.href = '/dashboard';
    document.getElementById('fabBtn').onclick = () => openUploadModal();

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closePdfViewer();
    });
})();
</script>
</body>
</html>
